<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="430" viewBox="0 0 1100 430" role="img" aria-labelledby="title desc">
  <title id="title">StrataDB architecture</title>
  <desc id="desc">HTTP clients connect to the C++ HTTP server, which uses a thread-safe key-value store and an append-only write-ahead log.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07141d"/>
      <stop offset="1" stop-color="#101b29"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000" flood-opacity=".28"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#35d6ad"/>
    </marker>
  </defs>
  <rect width="1100" height="430" rx="20" fill="url(#bg)"/>
  <text x="55" y="58" fill="#f1f7f8" font-family="Arial, sans-serif" font-size="28" font-weight="700">StrataDB request and durability flow</text>
  <text x="55" y="87" fill="#91a9b1" font-family="Arial, sans-serif" font-size="16">C++20 HTTP server • thread-safe state • append-only WAL recovery</text>

  <g filter="url(#shadow)">
    <rect x="55" y="150" width="190" height="110" rx="12" fill="#132b38" stroke="#2c6670"/>
    <text x="150" y="192" text-anchor="middle" fill="#35d6ad" font-family="Arial, sans-serif" font-size="18" font-weight="700">HTTP clients</text>
    <text x="150" y="220" text-anchor="middle" fill="#c7d8dc" font-family="Arial, sans-serif" font-size="14">curl / browser / service</text>

    <rect x="330" y="150" width="220" height="110" rx="12" fill="#163244" stroke="#387b91"/>
    <text x="440" y="192" text-anchor="middle" fill="#55c9ef" font-family="Arial, sans-serif" font-size="18" font-weight="700">HTTP server</text>
    <text x="440" y="220" text-anchor="middle" fill="#c7d8dc" font-family="Arial, sans-serif" font-size="14">GET / PUT / DELETE</text>

    <rect x="635" y="150" width="210" height="110" rx="12" fill="#213348" stroke="#667fba"/>
    <text x="740" y="192" text-anchor="middle" fill="#b8c8ff" font-family="Arial, sans-serif" font-size="18" font-weight="700">KeyValueStore</text>
    <text x="740" y="220" text-anchor="middle" fill="#c7d8dc" font-family="Arial, sans-serif" font-size="14">mutex + in-memory map</text>

    <rect x="635" y="320" width="210" height="65" rx="12" fill="#3a2937" stroke="#b66f98"/>
    <text x="740" y="348" text-anchor="middle" fill="#f2a8ca" font-family="Arial, sans-serif" font-size="17" font-weight="700">Binary WAL</text>
    <text x="740" y="370" text-anchor="middle" fill="#e0cbd6" font-family="Arial, sans-serif" font-size="13">append + replay</text>
  </g>

  <path d="M245 205 H320" stroke="#35d6ad" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M550 205 H625" stroke="#35d6ad" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M740 260 V310" stroke="#35d6ad" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M635 353 H580 V115 H440 V140" fill="none" stroke="#d38ab2" stroke-width="2" stroke-dasharray="7 7" marker-end="url(#arrow)"/>
  <text x="585" y="112" fill="#dca6c3" font-family="Arial, sans-serif" font-size="13">replay on startup</text>
  <text x="865" y="188" fill="#91a9b1" font-family="Arial, sans-serif" font-size="14">durable mutation</text>
  <text x="865" y="211" fill="#91a9b1" font-family="Arial, sans-serif" font-size="14">before response</text>
</svg>
